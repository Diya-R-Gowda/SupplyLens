server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Load-bearing, not just standard-practice insurance: unlike client/ (no
    # react-router), this app has real client-side routes (/dashboard,
    # /dashboard/suppliers/:id, /dashboard/analytics/*, etc. - see App.tsx).
    # A direct load or hard refresh on any of those needs this fallback to
    # not 404 at the nginx layer - it's what makes React Router able to take
    # over and render the right page client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
