server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Every real route is client-side state inside Dashboard.jsx, not
    # react-router - there's only ever one real HTML entry point, but this
    # fallback is kept anyway as standard SPA-serving practice in case that
    # changes later, and it's harmless (a hard refresh on "/" is the only
    # path that exists today).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
